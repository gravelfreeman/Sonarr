name: Docker Publish

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_branch:
        description: Branch to publish from GHCR
        required: false
        default: main
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: >
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'sync/upstream-v'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.ref || github.event.inputs.base_branch || 'main' }}

      - name: Fetch upstream tags
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/Sonarr/Sonarr.git
          git fetch upstream --tags

      - name: Resolve Sonarr version
        id: version
        run: bash .github/scripts/resolve-fork-version.sh

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=rolling
            type=semver,pattern={{version}},value=${{ steps.version.outputs.release_version }}
            type=semver,pattern={{major}}.{{minor}}.{{patch}},value=${{ steps.version.outputs.release_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.release_version }}
            type=semver,pattern={{major}},value=${{ steps.version.outputs.release_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.version=${{ steps.version.outputs.release_version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=sonarr
          cache-to: type=gha,mode=max,scope=sonarr
          build-args: |
            VERSION=${{ steps.version.outputs.release_version }}
            VENDOR=${{ github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Delete merged sync branch
        if: github.event_name == 'pull_request'
        env:
          SYNC_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: git push origin --delete "${SYNC_BRANCH}"
